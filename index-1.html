<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Galaxy Orb</title>
<style>
  :root {
    --bg: #05070d;
    --hint: #8a919b;
    --hud: #8a919b;
    --hudhi: #d5dae1;
    --line: #3a4048;
    --hud-rgb: 200,206,214;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="light"] { --bg: #eef1f6; --hint: #5d6573; --hud: #5d6573; --hudhi: #1d2430; --line: #c3cad6; --hud-rgb: 40,48,62; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) { --bg: #eef1f6; --hint: #5d6573; --hud: #5d6573; --hudhi: #1d2430; --line: #c3cad6; --hud-rgb: 40,48,62; }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    text-align: center; font: 13px/1.4 system-ui, sans-serif; letter-spacing: .08em;
    color: var(--hint); opacity: .8; transition: opacity 1.2s; pointer-events: none;
  }
  #hud { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #panel { position: fixed; left: 16px; top: calc(env(safe-area-inset-top, 0px) + 14px); pointer-events: none;
    font: 11px/1.7 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; color: var(--hud); }
  #st { color: var(--hudhi); margin-bottom: 4px; }
  #link { margin-top: 4px; opacity: .8; }
  #ro { margin: 0; font: inherit; white-space: pre; }
  #side { position: fixed; right: 14px; top: calc(env(safe-area-inset-top, 0px) + 10px);
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  #theme { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  #theme button { background: transparent; border: 0; padding: 8px 12px; color: var(--hud); line-height: 0; }
  #theme button[aria-pressed="true"] { background: var(--line); color: var(--hudhi); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #mic, #perf {
    font: 11px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .12em; color: var(--hudhi);
    background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 9px 13px; }
  #mic.on { background: var(--line); }
  #states { position: fixed; left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  #states button { font: 10px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .1em; color: var(--hud);
    background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 9px 10px; }
  #states button.on { color: var(--hudhi); background: var(--line); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="hud"></canvas>
<div id="panel"><div id="st">STANDBY</div><pre id="ro"></pre></div>
<div id="side">
  <button id="mic" type="button">MIC OFF</button>
  <div id="theme" role="group" aria-label="Theme">
    <button type="button" data-t="dark" aria-label="Dark theme" aria-pressed="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button type="button" data-t="light" aria-label="Light theme" aria-pressed="false"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </div>
  <button id="perf" type="button">PERF AUTO</button>
</div>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<div id="states"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function boot() {
  var SNOISE = [
    "vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}",
    "vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}",
    "vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);}",
    "vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-.85373472095314*r;}",
    "float snoise(vec3 v){",
    "const vec2 C=vec2(1./6.,1./3.); const vec4 D=vec4(0.,.5,1.,2.);",
    "vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);",
    "vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.-g;",
    "vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);",
    "vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;",
    "i=mod289(i);",
    "vec4 p=permute(permute(permute(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));",
    "float n_=.142857142857; vec3 ns=n_*D.wyz-D.xzx;",
    "vec4 j=p-49.*floor(p*ns.z*ns.z);",
    "vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.*x_);",
    "vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.-abs(x)-abs(y);",
    "vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);",
    "vec4 s0=floor(b0)*2.+1.; vec4 s1=floor(b1)*2.+1.; vec4 sh=-step(h,vec4(0.));",
    "vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;",
    "vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);",
    "vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));",
    "p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;",
    "vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.); m=m*m;",
    "return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));}"
  ].join("\n");

  var DOT_VERT = SNOISE + [
    "attribute float aSeed;",
    "uniform float uTime,uSpeed,uAmp,uLevel,uBass,uSize,uScan,uRimPow;",
    "varying float vAlpha,vPush,vRim;",
    "float hash(float n){return fract(sin(n)*43758.5453);}",
    "void main(){",
    "vec3 p=position; float t=uTime*uSpeed;",
    "float n=snoise(p*0.9+t)*0.5+snoise(p*1.8-t*1.3)*0.3+snoise(p*3.6+t*1.9)*0.2*clamp(uLevel*3.0,0.,1.);",
    "float breath=(sin(uTime*0.7)*0.5+0.5)*0.04;",
    "float energy=0.04+breath+uLevel*uAmp*0.55+uBass*uAmp*0.35;",
    "float push=sin(length(p)*6.0-uTime*3.0)*uBass*0.04;",
    "float d=clamp(n*energy+push,-0.45,0.45); vPush=d;",
    "vec4 mv=modelViewMatrix*vec4(p*(1.0+d),1.);",
    "vec3 v=normalize(-mv.xyz); vec3 nrm=normalize(normalMatrix*p);",
    "float rim=pow(1.0-abs(dot(nrm,v)),uRimPow); vRim=rim;",
    "float band=smoothstep(0.07,0.0,abs(p.y-uScan));",
    "float blink=step(0.985,hash(aSeed*91.7+floor(uTime*6.0)*13.1));",
    "vAlpha=0.14+rim*0.9+band*0.75+blink*0.8;",
    "gl_PointSize=uSize*(1.0+rim*0.7+band*0.9+blink*0.8)*(4.2/-mv.z);",
    "gl_Position=projectionMatrix*mv;}"
  ].join("\n");

  var DOT_FRAG = [
    "uniform vec3 uPrimary,uSecondary; uniform float uOpacity;",
    "varying float vAlpha,vPush,vRim;",
    "void main(){float r=length(gl_PointCoord-0.5); float a=smoothstep(0.5,0.12,r);",
    "vec3 col=mix(uPrimary,uSecondary,clamp(vRim*0.8+abs(vPush)*4.0,0.,1.));",
    "gl_FragColor=vec4(col,a*vAlpha*uOpacity);}"
  ].join("\n");

  var STRAY_VERT = SNOISE + [
    "attribute float aSeed; attribute vec3 aDir;",
    "uniform float uTime,uLevel,uSize; varying float vAlpha;",
    "void main(){",
    "float life=fract(aSeed+uTime*(0.02+uLevel*0.05));",
    "float r=1.0+life*(0.16+uLevel*0.35);",
    "vec3 p=aDir*r+aDir*snoise(aDir*2.0+uTime*0.2)*0.03;",
    "vec4 mv=modelViewMatrix*vec4(p,1.);",
    "vAlpha=(1.0-life)*smoothstep(0.0,0.06,life)*0.7;",
    "gl_PointSize=uSize*0.8*(4.2/-mv.z); gl_Position=projectionMatrix*mv;}"
  ].join("\n");

  var STRAY_FRAG = [
    "uniform vec3 uColor; varying float vAlpha;",
    "void main(){float r=length(gl_PointCoord-0.5);",
    "gl_FragColor=vec4(uColor,smoothstep(0.5,0.1,r)*vAlpha);}"
  ].join("\n");

  var GLOW_VERT = [
    "varying vec3 vN,vP;",
    "void main(){vec4 mv=modelViewMatrix*vec4(position,1.);",
    "vP=mv.xyz; vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*mv;}"
  ].join("\n");

  // Back faces only: peaks near the orb's edge and falls to zero in the middle (a halo, not a disc).
  var GLOW_FRAG = [
    "uniform vec3 uColor; uniform float uGlow; varying vec3 vN,vP;",
    "void main(){float d=abs(dot(normalize(vN),normalize(-vP)));",
    "float band=smoothstep(0.0,0.62,d)*(1.0-smoothstep(0.62,0.95,d));",
    "gl_FragColor=vec4(uColor,band*uGlow);}"
  ].join("\n");

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  ["c", "hud"].forEach(function (id) {   // fresh canvases so the scene can be destroyed and recreated
    var old = document.getElementById(id), fresh = document.createElement("canvas"); fresh.id = id;
    if (old) old.replaceWith(fresh); else document.body.prepend(fresh);
  });
  var canvas = document.getElementById("c");
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  var pr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(pr);
  renderer.setClearColor(0x05070d, 1);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.set(0, 0, 4.2);
  var group = new THREE.Group();
  scene.add(group);

  var rnd = mulberry32(7);
  var DOTS = 12000, STRAYS = 1400;

  // Dotted sphere (fibonacci spread)
  var pos = new Float32Array(DOTS * 3), seeds = new Float32Array(DOTS);
  for (var i = 0; i < DOTS; i++) {
    var y = 1 - (2 * (i + 0.5)) / DOTS, r = Math.sqrt(1 - y * y), phi = i * 2.399963229728653;
    pos[i * 3] = Math.cos(phi) * r; pos[i * 3 + 1] = y; pos[i * 3 + 2] = Math.sin(phi) * r;
    seeds[i] = rnd();
  }
  var dotGeo = new THREE.BufferGeometry();
  dotGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  dotGeo.setAttribute("aSeed", new THREE.BufferAttribute(seeds, 1));
  var dotMat = new THREE.ShaderMaterial({
    vertexShader: DOT_VERT, fragmentShader: DOT_FRAG,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uTime: { value: 0 }, uSpeed: { value: 0.2 }, uAmp: { value: 1 },
      uLevel: { value: 0 }, uBass: { value: 0 }, uSize: { value: 2.2 * pr }, uScan: { value: 0 }, uRimPow: { value: 2.2 },
      uPrimary: { value: new THREE.Color("#aab1ba") }, uSecondary: { value: new THREE.Color("#eef1f4") },
      uOpacity: { value: 1 }
    }
  });
  var dots = new THREE.Points(dotGeo, dotMat); dots.frustumCulled = false; group.add(dots);

  // Stray particles drifting off the rim
  var sPos = new Float32Array(STRAYS * 3), sDir = new Float32Array(STRAYS * 3), sSeed = new Float32Array(STRAYS);
  for (var k = 0; k < STRAYS; k++) {
    var z = rnd() * 2 - 1, a = rnd() * Math.PI * 2, rr = Math.sqrt(1 - z * z);
    sDir[k * 3] = rr * Math.cos(a); sDir[k * 3 + 1] = z; sDir[k * 3 + 2] = rr * Math.sin(a);
    sSeed[k] = rnd();
  }
  var strayGeo = new THREE.BufferGeometry();
  strayGeo.setAttribute("position", new THREE.BufferAttribute(sPos, 3));
  strayGeo.setAttribute("aDir", new THREE.BufferAttribute(sDir, 3));
  strayGeo.setAttribute("aSeed", new THREE.BufferAttribute(sSeed, 1));
  var strayMat = new THREE.ShaderMaterial({
    vertexShader: STRAY_VERT, fragmentShader: STRAY_FRAG,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uTime: { value: 0 }, uLevel: { value: 0 }, uSize: { value: 2.2 * pr },
      uColor: { value: new THREE.Color("#eef1f4") }
    }
  });
  var strays = new THREE.Points(strayGeo, strayMat); strays.frustumCulled = false; group.add(strays);

  // Faint halo
  var glowGeo = new THREE.IcosahedronGeometry(1.3, 6);
  var glowMat = new THREE.ShaderMaterial({
    vertexShader: GLOW_VERT, fragmentShader: GLOW_FRAG, side: THREE.BackSide,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uColor: { value: new THREE.Color("#aab1ba") }, uGlow: { value: 0.1 } }
  });
  group.add(new THREE.Mesh(glowGeo, glowMat));

  // Tick ring
  var tp = [], TICKS = 144;
  for (var t = 0; t < TICKS; t++) {
    var an = (t / TICKS) * Math.PI * 2, r0 = 1.42, r1 = t % 6 === 0 ? 1.5 : 1.46;
    tp.push(Math.cos(an) * r0, Math.sin(an) * r0, 0, Math.cos(an) * r1, Math.sin(an) * r1, 0);
  }
  var tickGeo = new THREE.BufferGeometry();
  tickGeo.setAttribute("position", new THREE.Float32BufferAttribute(tp, 3));
  var tickMat = new THREE.LineBasicMaterial({ color: "#aab1ba", transparent: true, opacity: 0.22, depthWrite: false });
  var ticks = new THREE.LineSegments(tickGeo, tickMat);
  ticks.rotation.x = 1.25; group.add(ticks);
  // thin orbital rings: visible only while thinking
  var rings = [], ringMats = [], ringSpeeds = [0.25, -0.18, 0.12];
  [[1.55, 1.2, 0.2], [1.65, 0.5, 1.0], [1.75, -0.8, 0.6]].forEach(function (d) {
    var m = new THREE.MeshBasicMaterial({ color: "#aab1ba", transparent: true, opacity: 0, depthWrite: false });
    var mesh = new THREE.Mesh(new THREE.TorusGeometry(d[0], 0.004, 8, 160), m);
    mesh.rotation.set(d[1], d[2], 0); group.add(mesh); rings.push(mesh); ringMats.push(m);
  });

  // ---- Layer 2: the sky (full-screen shader quad, drawn first, no depth) ----
  var SKY_VERT = "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }";
  var SKY_FRAG = [
    "uniform float uTime, uAspect, uLevel, uLight; uniform vec3 uOrb; uniform sampler2D uDigits; varying vec2 vUv;",
    "float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }",
    "float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);",
    "  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x), f.y); }",
    "float fbm(vec2 p){ float v=0., a=.5; mat2 r=mat2(.8,-.6,.6,.8);",
    "  for(int i=0;i<5;i++){ v+=a*vnoise(p); p=r*p*2.02+vec2(3.1,1.7); a*=.5; } return v; }",
    // random digits 1-9 on a grid that is square in screen space (p already has the aspect applied)
    "float digits(vec2 p, float density, float rarity, float speed, float seed){",
    "  vec2 g=p*density; vec2 id=floor(g); vec2 f=fract(g);",
    "  float h=hash(id+seed);",
    "  float slot=floor(uTime*speed*.5+h*10.);",
    "  float dg=min(8.,floor(hash(id+seed+slot*3.7)*9.));",
    "  vec2 q=(f-.5)/.72+.5;",
    "  float inside=step(0.,q.x)*step(q.x,1.)*step(0.,q.y)*step(q.y,1.);",
    "  q=clamp(q,.03,.97);",
    "  float tex=texture2D(uDigits, vec2((dg+q.x)/9., q.y)).r;",
    "  float tw=.5+.5*sin(uTime*speed*(.5+h*2.)+h*40.);",
    "  return tex*inside*step(rarity,h)*tw; }",
    "void main(){",
    "  vec2 p=(vUv-.5)*vec2(uAspect,1.);",
    "  float r=length(p);",
    "  vec3 col=mix(vec3(.014,.020,.045), vec3(.004,.006,.014), smoothstep(.15,.9,r));",
    "  float t=uTime*.01; float boost=1.+uLevel*.9;",
    "  float n1=fbm(p*1.6+vec2(t,-t*.7));",
    "  float n2=fbm(p*1.3+vec2(-t*.8,t)+5.2);",
    "  float n3=fbm(p*1.9+vec2(t*.6,t*.9)+9.7);",
    "  col+=vec3(.05,.19,.16)*smoothstep(.46,.78,n1)*.55*boost;",
    "  col+=vec3(.15,.08,.21)*smoothstep(.48,.80,n2)*.50*boost;",
    "  col+=vec3(.06,.11,.25)*smoothstep(.47,.78,n3)*.55*boost;",
    // bloom in the orb's colour behind the centre, brighter with voice, tiny pale core
    "  float bl=exp(-r*r*5.)*.07+exp(-r*r*18.)*.10;",
    "  col+=uOrb*bl*(1.+uLevel*2.5);",
    "  col+=vec3(.75,.9,1.)*exp(-r*r*90.)*.035*(1.+uLevel);",
    // random digits 1-9: a fine sparse field plus a few larger ones
    "  float fine=digits(p,40.,.93,2.0,0.);",
    "  float big=digits(p+17.3,15.,.96,1.0,31.);",
    "  float keep=mix(.3,1.,smoothstep(.25,.5,r));",
    "  col+=vec3(.70,.78,.90)*fine*.45*keep+vec3(.80,.88,.98)*big*.55*keep;",
    "  col*=mix(1.,.55,smoothstep(.3,.95,r));",
    // light theme: pale dawn, nebula as soft tints, no stars or digits
    "  vec3 lcol=mix(vec3(.94,.955,.98), vec3(.84,.875,.93), smoothstep(.15,.9,r));",
    "  lcol=mix(lcol, vec3(.62,.86,.82), smoothstep(.46,.78,n1)*.30*boost);",
    "  lcol=mix(lcol, vec3(.80,.72,.92), smoothstep(.48,.80,n2)*.28*boost);",
    "  lcol=mix(lcol, vec3(.66,.78,.95), smoothstep(.47,.78,n3)*.30*boost);",
    "  lcol=mix(lcol, uOrb, clamp(bl*(1.+uLevel*2.5)*1.2,0.,.30));",
    "  lcol*=mix(1.,.94,smoothstep(.3,.95,r));",
    "  col=mix(col,lcol,uLight);",
    "  gl_FragColor=vec4(col,1.);",
    "}"
  ].join("\n");
  // digit atlas: glyphs 1-9 side by side
  var dc = document.createElement("canvas"); dc.width = 576; dc.height = 64;
  var dx = dc.getContext("2d");
  dx.fillStyle = "#fff"; dx.textAlign = "center"; dx.textBaseline = "middle";
  dx.font = "bold 46px ui-monospace, Menlo, Consolas, monospace";
  for (var di = 0; di < 9; di++) dx.fillText(String(di + 1), di * 64 + 32, 35);
  var digitTex = new THREE.CanvasTexture(dc);
  digitTex.minFilter = THREE.LinearFilter; digitTex.magFilter = THREE.LinearFilter; digitTex.generateMipmaps = false;
  var skyScene = new THREE.Scene();
  var skyCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  var skyMat = new THREE.ShaderMaterial({
    vertexShader: SKY_VERT, fragmentShader: SKY_FRAG, depthTest: false, depthWrite: false,
    uniforms: {
      uTime: { value: 0 }, uAspect: { value: 1 }, uLevel: { value: 0 }, uDigits: { value: digitTex }, uLight: { value: 0 },
      uOrb: { value: new THREE.Color("#aab1ba").multiplyScalar(0.7) }
    }
  });
  var skyQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), skyMat);
  skyQuad.frustumCulled = false;
  skyScene.add(skyQuad);

  // ---- Layer 3: the star network (own perspective camera, drawn between sky and orb) ----
  var netScene = new THREE.Scene();
  var netGroup = new THREE.Group();
  netScene.add(netGroup);
  var netCam = new THREE.PerspectiveCamera(60, 1, 0.1, 200);
  netCam.position.set(0, 0, 42);

  var nrnd = mulberry32(21); // seeded: same galaxy every time
  var NODE_TOTAL = 100;
  var HUES = ["#2ec4b6", "#22d3ee", "#3b82f6", "#a855f7", "#34d399", "#6366f1", "#2aa7d6", "#8b5cf6"];
  var nPos = [], nCol = [], nSize = [];
  function unitVec() {
    var z = nrnd() * 2 - 1, a = nrnd() * Math.PI * 2, rr = Math.sqrt(1 - z * z);
    return [rr * Math.cos(a), z, rr * Math.sin(a)];
  }

    // voice = bins 10-60%, bass = first 6 bins, treble = 65%+ ; real mic boosted x2.4 with a small floor
    voice = avg(F, Math.floor(N * 0.1), Math.floor(N * 0.6));
    var floor = (state === "listening" && micLive) ? 0.03 : 0;
    level = smooth(level, Math.min(1, voice * gain + floor), dt);
    bass = smooth(bass, Math.min(1, avg(F, 0, 6) * gain * 0.8), dt);
    treble = smooth(treble, Math.min(1, avg(F, Math.floor(N * 0.65), N) * gain), dt);

    // 2) ease every parameter toward the current state's targets (nothing snaps)
    var k = ease(dt, 3.5);
    NUM_KEYS.forEach(function (key) { cur[key] += (S[key] - cur[key]) * k; });
    tgtP.set(S.primary); tgtS.set(S.secondary);
    if (state === "processing") tgtP.lerp(tgtS, 0.5 + 0.5 * Math.sin(tm * 0.7)); // slow colour cycle
    curP.lerp(tgtP, k); curS.lerp(tgtS, k);
    lightMix += ((theme === "light" ? 1 : 0) - lightMix) * ease(dt, 5);
    if ((lightMix > 0.5) !== lightBlend) applyBlending(lightMix > 0.5);
    themed(curP, finP, 0.36); themed(curS, finS, 0.5);
    perfAge += dt;
    if (perfMode === "auto" && !perfOn && !document.hidden) {
      fpsAvg += (1 / Math.max(dt, 0.001) - fpsAvg) * 0.1;
      lowT = fpsAvg < 45 ? lowT + dt : 0;
      if (perfDecision(lowT, perfAge)) applyPerf(true);
    }

    // the galaxy answers the AI (speaking / thinking), not the user
    var vv = (state === "speaking" || state === "processing") ? level : 0;

    // 3) orb
    var u = dotMat.uniforms;
    u.uTime.value = tm; u.uLevel.value = level; u.uBass.value = bass;
    u.uScan.value = ((tm * 0.18) % 2.2) - 1.1;
    u.uSpeed.value = cur.noise; u.uAmp.value = cur.amp; u.uRimPow.value = cur.rimPow; u.uOpacity.value = cur.opacity * (1 + 0.25 * lightMix);
    u.uPrimary.value.copy(finP); u.uSecondary.value.copy(finS);
    strayMat.uniforms.uTime.value = tm; strayMat.uniforms.uLevel.value = level; strayMat.uniforms.uColor.value.copy(finS);
    glowMat.uniforms.uColor.value.copy(finP); glowMat.uniforms.uGlow.value = cur.glow + level * 0.25;
    tickMat.color.copy(finP); tickMat.opacity = 0.22 + level * 0.4;
    group.rotation.y += cur.rot * adt;
    group.rotation.x = Math.sin(tm * 0.1) * 0.15;
    group.scale.setScalar(1 + level * 0.06 + bass * 0.04);
    ticks.rotation.z += 0.05 * adt;
    for (i = 0; i < 3; i++) {
      rings[i].rotation.z += ringSpeeds[i] * adt;
      ringMats[i].opacity = cur.rings * (0.5 + 0.25 * i); ringMats[i].color.copy(finS);
    }

    // 4) sky + star network
    skyMat.uniforms.uTime.value = tm; skyMat.uniforms.uLevel.value = vv;
    skyMat.uniforms.uOrb.value.copy(finP).multiplyScalar(0.7 + 0.3 * lightMix);
    skyMat.uniforms.uLight.value = lightMix;
    netGroup.rotation.y += (0.012 + vv * 0.03) * adt;
    netGroup.rotation.x = Math.sin(tm * 0.05) * 0.15;
    netGroup.rotation.z = Math.sin(tm * 0.037) * 0.08;
    netGroup.scale.setScalar(1 + vv * 0.05);
    nodeMat.uniforms.uBright.value = 0.8 + vv * 0.6; nodeMat.uniforms.uGrow.value = (1 + vv * 0.35) * (1 - 0.4 * lightMix);
    nodeMat.uniforms.uAlpha.value = 1 - 0.45 * lightMix; dustMat.uniforms.uAlpha.value = 1 - 0.5 * lightMix;
    netLineMat.opacity = Math.min(1, (0.12 + vv * 0.53) * (1 + 1.2 * lightMix));
    netCam.position.set(
      Math.sin(tm * 0.02) * 2 + vv * 0.04 * (Math.sin(tm * 23) + Math.sin(tm * 31.7)),
      Math.cos(tm * 0.017) * 1.5 + vv * 0.04 * Math.sin(tm * 27),
      42 - vv * 2);
    netCam.lookAt(0, 0, 0);

    renderer.autoClear = false; renderer.clear();
    renderer.render(skyScene, skyCam);   // pass 1: sky
    renderer.render(netScene, netCam);   // pass 2: star network
    renderer.clearDepth();
    renderer.render(scene, camera);      // pass 3: orb on top

    drawHud(F, W);

    if ((frameNo++ % 3) === 0) {
      var receiving = level > 0.12, status;
      if (state === "idle") status = "IDLE";
      else if (state === "arming") status = "ARMING \u00b7 WAITING FOR MIC";
      else if (state === "listening") status = micLive ? (receiving ? "RECEIVING VOCALS" : "LISTENING \u00b7 NO SIGNAL") : "LISTENING \u00b7 SIMULATED";
      else if (state === "processing") status = "THINKING";
      else if (state === "speaking") status = pAnalyser ? "SPEAKING \u00b7 PLAYBACK TAP" : "SPEAKING \u00b7 SIMULATED";
      else status = micState === "error" ? "ERROR \u00b7 MIC BLOCKED OR UNAVAILABLE" : "ERROR";
      stEl.textContent = "\u25cf " + status;
      stEl.style.opacity = (receiving || state === "arming") ? (0.65 + 0.35 * Math.sin(tm * 8)) : 0.7;
      roEl.textContent =
        "VOX  " + meter(level) + " " + pct(level) + "\n" +
        "BASS " + meter(bass) + " " + pct(bass) + "\n" +
        "HIGH " + meter(treble) + " " + pct(treble) + "\n" +
        "RATE " + (actx ? (actx.sampleRate / 1000).toFixed(1) + " kHz" : "--") + "  FFT 256";
    }
    raf = requestAnimationFrame(frame);
  }
  frame();
  return api;
}
boot();
</script>
